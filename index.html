<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Preethi Subway Surfers: 3D Endless Runner</title>
    <meta name="theme-color" content="#120c1f"/>
    <link rel="icon" type="image/png" href="assets/images/preethi_face_closeup.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
        }
    }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0714;
            font-family: 'Nunito', sans-serif;
        }
        #game-frame {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }
        #game-canvas-container {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        .glass-badge {
            background: rgba(18, 12, 31, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }
        .btn-glow {
            box-shadow: 0 8px 25px rgba(245, 166, 35, 0.45);
        }
        .font-game {
            font-family: 'Fredoka One', cursive;
        }
        @keyframes pulse-play {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-play {
            animation: pulse-play 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

<div id="game-frame">
    <!-- WebGL Three.js Canvas Container -->
    <div id="game-canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer flex flex-col justify-between p-4">
        
        <!-- TOP HUD -->
        <div id="screen-hud" class="w-full flex justify-between items-start hidden">
            <!-- Player Profile Badge -->
            <div class="glass-badge rounded-2xl p-2 flex items-center gap-2.5">
                <img src="assets/images/preethi_face_closeup.png" alt="Preethi" class="w-11 h-11 rounded-xl object-cover border-2 border-amber-400 shadow-md"/>
                <div>
                    <h3 class="text-white font-extrabold text-sm tracking-wide leading-tight">PREETHI</h3>
                    <p id="hud-distance" class="text-amber-300 font-bold text-xs">0m</p>
                </div>
            </div>

            <!-- Score & Coins -->
            <div class="flex flex-col items-end gap-1.5">
                <!-- Score -->
                <div class="glass-badge rounded-xl px-3 py-1 text-right">
                    <span class="text-white/60 text-[10px] font-black uppercase tracking-wider block">SCORE</span>
                    <span id="hud-score" class="font-game text-2xl text-white tracking-wider">0</span>
                </div>
                <!-- Coins -->
                <div class="glass-badge rounded-xl px-3 py-1 flex items-center gap-1.5">
                    <span class="text-amber-400 font-game text-base">🪙</span>
                    <span id="hud-coins" class="font-game text-amber-300 text-lg">0</span>
                </div>
            </div>
        </div>

        <!-- CENTER MENU SCREEN -->
        <div id="screen-menu" class="absolute inset-0 flex flex-col items-center justify-between p-6 interactive bg-gradient-to-t from-black/80 via-transparent to-black/40">
            <!-- Top Branding -->
            <div class="text-center mt-6">
                <div class="inline-flex items-center gap-2 glass-badge px-4 py-1.5 rounded-full mb-3 border border-amber-400/30">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-white/90 text-xs font-black tracking-widest uppercase">PREMIUM 3D EDITION</span>
                </div>
                <h1 class="font-game text-4xl text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-400 to-amber-200 drop-shadow-lg tracking-wider">
                    SUBWAY PREETHI
                </h1>
                <p class="text-white/70 text-xs font-extrabold tracking-widest uppercase mt-1">ENDLESS RAILWAY RUNNER</p>
            </div>

            <!-- Big Play Button -->
            <div class="flex flex-col items-center gap-4 my-auto">
                <button id="btn-play-run" class="w-32 h-32 rounded-full bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-300 border-4 border-white flex flex-col items-center justify-center btn-glow active:scale-95 transition-transform animate-play">
                    <span class="font-game text-3xl text-black tracking-wider drop-shadow-sm ml-1">PLAY</span>
                </button>
                <div class="glass-badge px-4 py-2 rounded-xl text-center">
                    <p class="text-white/80 text-[11px] font-extrabold uppercase tracking-wide">
                        <span class="text-amber-400 font-black">Controls:</span> Arrow Keys / Swipe to Dodge & Jump
                    </p>
                </div>
            </div>

            <!-- Preethi Character Tag -->
            <div class="glass-badge px-4 py-2.5 rounded-2xl flex items-center gap-3 w-full max-w-xs border border-purple-500/30">
                <img src="assets/images/preethi_face_closeup.png" class="w-10 h-10 rounded-xl object-cover border border-purple-400"/>
                <div class="flex-1">
                    <p class="text-white text-xs font-extrabold">Playable Character</p>
                    <p class="text-purple-300 text-[11px] font-bold">Preethi (Original 3D Model)</p>
                </div>
            </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="screen-gameover" class="absolute inset-0 flex flex-col items-center justify-center p-6 interactive hidden bg-black/85 backdrop-blur-md">
            <div class="glass-badge p-6 rounded-3xl w-full max-w-sm text-center flex flex-col gap-4 border-2 border-red-500/30 shadow-2xl">
                <div>
                    <h2 class="font-game text-3xl text-red-500 tracking-wider">RUN TERMINATED</h2>
                    <p class="text-white/50 text-xs font-bold uppercase tracking-widest mt-1">SUBWAY COLLISION</p>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-2 gap-2.5 my-2">
                    <div class="bg-white/5 border border-white/10 rounded-2xl p-3">
                        <span class="text-white/50 text-[10px] font-black uppercase tracking-wider block">FINAL SCORE</span>
                        <span id="gameover-score" class="font-game text-2xl text-amber-300">0</span>
                    </div>
                    <div class="bg-white/5 border border-white/10 rounded-2xl p-3">
                        <span class="text-white/50 text-[10px] font-black uppercase tracking-wider block">COINS</span>
                        <span id="gameover-coins" class="font-game text-2xl text-yellow-400">0</span>
                    </div>
                    <div class="col-span-2 bg-white/5 border border-white/10 rounded-2xl p-3">
                        <span class="text-white/50 text-[10px] font-black uppercase tracking-wider block">ALL-TIME HIGH SCORE</span>
                        <span id="gameover-highscore" class="font-game text-xl text-emerald-400">0</span>
                    </div>
                </div>

                <!-- Play Again Button -->
                <button id="btn-play-again" class="py-4 bg-gradient-to-r from-amber-400 to-orange-500 rounded-2xl font-game text-lg text-black uppercase tracking-wider active:scale-95 transition-all shadow-lg">
                    PLAY AGAIN
                </button>
            </div>
        </div>

    </div>
</div>

<script type="module" src="src/game/Game3D.js"></script>
</body>
</html>

</html>
